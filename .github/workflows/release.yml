# A v* tag: test, build the .deb and SHA256SUMS, wait for a second
# maintainer's approval, sign SHA256SUMS, publish the release (ADR 0025).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends golang-go git openssh-client make ca-certificates
          useradd -m ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: version from the tag
        run: |
          v=${GITHUB_REF_NAME#v}
          echo "$v" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          echo "VERSION=$v" >>"$GITHUB_ENV"
      - run: |
          chown -R ci .
          su ci -c 'GOFLAGS=-buildvcs=false make test'
      - run: GOFLAGS=-buildvcs=false packaging/build-deb.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # Live once public: GitHub Free enforces the approval gate only there (ADR 0022).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment: release # required reviewers; the key is its secret alone
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: sign SHA256SUMS
        env:
          KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$KEY" >"$key"
          (cd dist && sha256sum -c SHA256SUMS)
          ssh-keygen -Y sign -n file -f "$key" dist/SHA256SUMS
          ssh-keygen -y -f "$key" | awk '{ print "dovy-release namespaces=\"file\" " $1 " " $2 }' >allowed_signers
          ssh-keygen -Y verify -f allowed_signers -I dovy-release -n file -s dist/SHA256SUMS.sig <dist/SHA256SUMS
          echo "KEYLINE=$(cat allowed_signers)" >>"$GITHUB_ENV"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Verify, then install:"
            echo
            echo '```sh'
            echo "echo '$KEYLINE' > allowed_signers"
            echo 'ssh-keygen -Y verify -f allowed_signers -I dovy-release -n file -s SHA256SUMS.sig < SHA256SUMS'
            echo 'sha256sum -c --ignore-missing SHA256SUMS'
            echo 'sudo apt install ./dovy_*.deb'
            echo '```'
          } >notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
